# Сборка настольного приложения под Windows, macOS и Linux.
#
# Почему CI, а не машина разработчика. Пакет под macOS собирается только на macOS —
# это требование самой платформы, обойти его на Windows нечем. AppImage под Linux
# формально собирается и на другой системе, но с оговорками, которые проверить негде.
# Здесь каждый пакет собирает свой раннер, на своей платформе, из того же исходника.
#
# Приложение НЕ подписано — сознательно (решение Александра, 2026-08-07). Подпись стоит
# денег каждый год и на первую тройку сборок не влияет ничем, кроме предупреждения при
# первом запуске. Что именно увидит человек — написано в README, в разделе про установку.
#
# Запускается вручную (workflow_dispatch) или тегом версии. Тег ничего не решает сам:
# номер версии берётся из package.json. Имя тега на файлы не влияет — если они
# разойдутся, релиз v0.2.0 будет содержать файлы с 0.0.10 в имени. Сначала версия в
# package.json, потом тег под неё.

name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Одна упавшая платформа не отменяет две другие: две работающие сборки лучше нуля,
      # а причину третьей видно в её собственном журнале.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos-arm64
          # Сборки под Intel-Mac нет, и это решение, а не забывчивость.
          #
          # Метка macos-13 выключена GitHub — задача с ней не падает, а вечно ждёт
          # машину, которой больше нет (проверено 2026-08-08). Замена называется
          # macos-15-intel, но это раннер класса «large», а они тарифицируются даже
          # в открытых репозиториях: бесплатны только обычные.
          #
          # Apple перешла на свои процессоры в конце 2020 года, так что arm64 покрывает
          # все Маки моложе пяти лет. Появится живой человек с Intel-Маком — вернём,
          # тогда и будет понятно, за что платить.

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Сторожа сборки — до самой сборки. Полного набора тестов здесь нет намеренно:
      # он идёт десять минут на каждой из трёх платформ, а выпуск делается с ветки,
      # которую test.yml уже прогнал целиком. Но эти два быстрые и стерегут то, что
      # ломается ИМЕННО на релизном раннере: соответствие манифеста хешей списку
      # платформ и версии инструмента, плюс состав build.files.
      #
      # Добавлено 2026-08-10 по ревью: релизный раннер собирал установщик без единого
      # теста, и сторож манифеста, ради которого он писался, здесь не работал вовсе.
      - name: Guard the release config
        run: npx vitest run tests/ktx-manifest.test.mjs tests/electron-config.test.mjs

      # Строго, без --optional: собранный пакет без ktx — это пакет, в котором молча не
      # работает KTX2. Пусть лучше упадёт сборка, чем узнает пользователь.
      - name: Bundle the KTX2 encoder
        run: node scripts/bundle-ktx.mjs

      - name: Build
        run: npx electron-builder --publish never
        env:
          # Без сертификата electron-builder на macOS иначе ищет его в связке ключей
          # и падает. Отсутствие подписи здесь — заявленное состояние, а не сбой.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Собранное отдаём артефактом всегда — в том числе когда запускали вручную и
      # релиза нет. Иначе проверить сборку можно было бы только выпустив её.
      - uses: actions/upload-artifact@v5
        with:
          name: Tanyra3D-${{ matrix.name }}
          path: |
            dist-app/*.exe
            dist-app/*.AppImage
            dist-app/*.deb
            dist-app/*.dmg
            dist-app/*.zip
          if-no-files-found: error
          retention-days: 14

      # Релиз создаётся здесь же, если его ещё нет.
      #
      # Раньше шаг умел только дописывать в готовый релиз — и это не работало ни при
      # каком порядке действий. Черновик релиза тег не создаёт, значит сборка не
      # запускается; опубликованный релиз висит пустым те десять минут, пока идут
      # сборки, и человек в это время видит страницу без единого файла.
      #
      # Три задачи бегут одновременно и все три пытаются создать релиз — побеждает
      # первая, остальные получают «уже существует» и спокойно идут дальше загружать
      # свои файлы. Гонка здесь безобидна, потому что создание идемпотентно по смыслу.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "Tanyra3D ${GITHUB_REF_NAME}" \
                 --generate-notes \
            || true
          gh release upload "${GITHUB_REF_NAME}" \
            $(ls dist-app/*.exe dist-app/*.AppImage dist-app/*.deb dist-app/*.dmg 2>/dev/null) \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

name: Test

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Упавшая версия не отменяет остальные. Иначе первая же красная гасит соседей,
      # и вместо «сломано на 18, работает на 20 и 22» видно «1 failing, 2 cancelled» —
      # то есть неизвестно, сломано ли вообще что-то, кроме одной версии.
      fail-fast: false
      matrix:
        # 18 убрана 2026-08-08, и не из-за Playwright, с которого началось.
        # Требования РАБОЧИХ зависимостей: sharp >=20.9.0, @gltf-transform/cli >=20.
        # На Node 18 установка проходит, а программа падает на первой же текстуре.
        # Обещание «Node 18+» в README было неверным — версии подняты вслед за этим.
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Браузерные тесты (viewer-regression.browser.test.mjs) требуют Chromium
      # через @vitest/browser + playwright. --with-deps ставит системные библиотеки
      # для отрисовки (libGL, libEGL и т.д.) на ubuntu-latest.
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Весь набор, а не один файл. tests/optimize.test.mjs обёрнут в
      # describeIfModels(['CarConcept.glb']), а CarConcept — модель Khronos, в
      # репозиторий она не коммитится. На CI файла нет → набор пропускается →
      # vitest возвращает 0 → бейдж зелёный, притом что не выполнено ни одного
      # теста. Зелёный бейдж, ничего не проверяющий, хуже отсутствующего.
      #
      # `npx vitest run` работает на моделях, которые лежат в git (см.
      # исключения в fixtures/.gitignore). Тесты на локальные модели помечаются
      # skipped с указанием причины — это видно в логе, а не растворяется.
      # Проверено на чистом клоне: набор зелёный, пропуски — с указанием причины.
      #
      # Браузерные тесты (browser-проект) запускаются вместе с node — конфиг
      # vitest настроен на projects, и `npx vitest run` гоняет все проекты.
      # Скриншоты падений сохраняются в tests/__screenshots__/.
      - name: Run tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      # Страховка от повторения истории выше: если однажды все файлы окажутся
      # за guard'ом, шаг упадёт вместо того, чтобы молча позеленеть. Читает
      # отчёт предыдущего шага, второй прогон не делает.
      # Порог 100 — с большим запасом ниже того, что реально выполняется на чистом клоне.
      - name: Fail if nothing actually ran
        run: |
          PASSED=$(node -e "console.log(require('./vitest-report.json').numPassedTests || 0)")
          echo "Tests actually executed: $PASSED"
          if [ "$PASSED" -lt 100 ]; then
            echo "::error::Only $PASSED tests ran — the suite was almost entirely skipped; this is not a green run"
            exit 1
          fi

      # WebP-покрытие и сторож плотности отчёта (docs/EXTENDING.md §5b) — обязательный гейт.
      # Файлы уже входят в общий `npx vitest run` выше, но отдельный шаг делает их
      # обязательность явной и несводимой к общему числу: если эти два файла
      # пропадут из include или их набор целиком пропустится (на диске нет ни
      # одной их модели) — шаг упадёт, а не молча позеленеет. Порог 10 против
      # ~35 реально выполняемых на чистом клоне (webp: 4 репо-модели, плотность:
      # 7 репо-моделей × 4 набора флагов + мета-тест + 2 теста механизма).
      # Переиспользуем vitest-report.json: общий гейт выше уже прочитал его,
      # а имя уже в .gitignore.
      - name: Run webp + report-density tests (mandatory gate)
        run: |
          npx vitest run --project node tests/webp.test.mjs tests/report-density.test.mjs --reporter=default --reporter=json --outputFile=vitest-report.json
          PASSED=$(node -e "console.log(require('./vitest-report.json').numPassedTests || 0)")
          echo "Tests executed (webp + report density): $PASSED"
          if [ "$PASSED" -lt 10 ]; then
            echo "::error::Only $PASSED webp/density tests ran — almost entirely skipped; this is not a green run"
            exit 1
          fi

      # Проверка baseline-гейта: преднамеренно ломаем BASELINE_ITS и убеждаемся,
      # что vitest globalSetup валит suite с ненулевым exit-кодом. Если гейт
      # молча пропустит сломанный baseline — шаг красный (exit 1).
      #
      # Использует только --project node (быстрее), browser-тесты не трогает.
      # trap гарантирует восстановление baselines.json при любом исходе.
      - name: Verify baseline gate actually fails on violation
        run: |
          trap 'mv tests/baselines.json.bak tests/baselines.json 2>/dev/null; echo "--- Restored baselines.json ---"' EXIT
          cp tests/baselines.json tests/baselines.json.bak
          node -e "
            const fs = require('fs');
            const f = JSON.parse(fs.readFileSync('tests/baselines.json','utf-8'));
            f.BASELINE_ITS = 999;
            fs.writeFileSync('tests/baselines.json', JSON.stringify(f, null, 2) + '\n');
          "
          echo '--- Running with a deliberately broken baseline (BASELINE_ITS=999); failure is expected ---'
          if npx vitest run --project node; then
            echo '::error::Baseline gate passed with BASELINE_ITS=999 — gate is NOT working!'
            exit 1
          else
            echo '✓ Baseline gate correctly aborted the suite (exit code non-zero)'
          fi

      # Скриншоты падений браузерных тестов — артефакт для отладки.
      # Сохраняются даже при провале шага Run tests (if: always()).
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots-${{ matrix.node-version }}
          path: tests/__screenshots__/
          if-no-files-found: ignore
          retention-days: 7
